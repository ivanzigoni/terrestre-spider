services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terrestre}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terrestre}
      POSTGRES_DB: ${POSTGRES_DB:-terrestre_spider}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-terrestre}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
